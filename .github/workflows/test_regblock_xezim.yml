name: Test PeakRDL Regblock xezim
on:
  push:
    # tags-ignore:
    #   - '**'  # Don't run on any tags
  pull_request:
  schedule:
    - cron: '0 1 * * 0'
jobs:
  build_code_linux:
    strategy:
      fail-fast: false # So that one fail doesn't stop remaining tests
      matrix:
        python-version: ["3.13"]
        cpuif: ["passthrough", "apb4-flat", "apb3-flat", "axi4-lite-flat", "avalon-mm-flat", "obi-flat", "wishbone-flat", "apb4", "apb3", "axi4-lite", "avalon-mm", "obi", "wishbone"]
        target: [xezim]
    # setup-xezim ships a build for Ubuntu 24.04; do not use ubuntu-latest.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - name: Setup xezim
        uses: daxzio/setup-xezim@v1
        with:
          version: "0.11.6"
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -m pip install .
          python -m pip uninstall -y peakrdl-regblock
          python -m pip install --upgrade git+https://github.com/daxzio/PeakRDL-regblock.git@develop
          # The wheel carries no hdl-src/*_intf.sv, so generate_wrapper.py cannot
          # find the non-flat interface sources. Place them next to the package.
          sitepkg="$(python -c 'import os, peakrdl_regblock; print(os.path.dirname(os.path.dirname(peakrdl_regblock.__file__)))')"
          git clone -q --depth 1 -b develop https://github.com/daxzio/PeakRDL-regblock.git /tmp/peakrdl-regblock-src
          cp -r /tmp/peakrdl-regblock-src/hdl-src "${sitepkg}/"
          ls "${sitepkg}/hdl-src"
      - name: Patch cocotb with the xezim simulator makefile
        run: |
          # Upstream cocotb has no SIM=xezim. Install the makefile beside the others.
          dest="$(cocotb-config --makefiles)/simulators"
          cp .github/xezim/Makefile.xezim "${dest}/Makefile.xezim"
          test -f "${dest}/Makefile.xezim"
      - name: Run Tests
        run: |
          unset PYTHONHOME
          xezim -V
          cd tests
          # Regblock SystemVerilog: the same file list Verilator compiles.
          ./test_all.sh REGBLOCK=1 SIM=xezim GIT_CHECK=0 CPUIF=${{ matrix.cpuif }}
