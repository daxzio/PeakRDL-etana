name: Test PeakRDL Regblock xezim
on:
  push:
    # tags-ignore:
    #   - '**'  # Don't run on any tags
  pull_request:
  schedule:
    - cron: '0 1 * * 0'
jobs:
  build_code_linux:
    strategy:
      fail-fast: false # So that one fail doesn't stop remaining tests
      matrix:
        python-version: ["3.13"]
        # Flat interfaces only. The non-flat ones need hdl-src/*_intf.sv from a
        # peakrdl-regblock source checkout; a pip git install ships no hdl-src,
        # so generate_wrapper.py cannot find them (same failure on Verilator).
        cpuif: ["passthrough", "apb4-flat", "apb3-flat", "axi4-lite-flat", "avalon-mm-flat", "obi-flat", "wishbone-flat"]
        target: [xezim]
    # setup-xezim ships a build for Ubuntu 24.04; do not use ubuntu-latest.
    runs-on: ubuntu-24.04
    env:
      # peakrdl-regblock@main declares field_storage after the write-buffer
      # always blocks that read it (test_write_buffer). Verilator tolerates it,
      # xezim rejects it by default. Fixed on daxzio/PeakRDL-regblock develop.
      XEZIM_RELAX_USE_BEFORE_DECL: "1"

    steps:
      - uses: actions/checkout@v5
      - name: Setup xezim
        uses: daxzio/setup-xezim@v1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -m pip install .
          python -m pip uninstall -y peakrdl-regblock
          python -m pip install --upgrade git+https://github.com/SystemRDL/PeakRDL-regblock.git@develop
      - name: Patch cocotb with the xezim simulator makefile
        run: |
          # Upstream cocotb has no SIM=xezim. Install the makefile beside the others.
          dest="$(cocotb-config --makefiles)/simulators"
          cp .github/xezim/Makefile.xezim "${dest}/Makefile.xezim"
          test -f "${dest}/Makefile.xezim"
      - name: Run Tests
        run: |
          unset PYTHONHOME
          xezim -V
          cd tests
          # Regblock SystemVerilog: the same file list Verilator compiles.
          ./test_all.sh REGBLOCK=1 SIM=xezim GIT_CHECK=0 CPUIF=${{ matrix.cpuif }}
