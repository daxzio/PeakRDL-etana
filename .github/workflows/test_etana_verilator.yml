name: Test PeakRDL Etana verilator
on:
  push:
    # tags-ignore:
    #   - '**'  # Don't run on any tags
  pull_request:
  schedule:
    - cron: '0 1 * * 0'
jobs:
  build_code_linux:
    strategy:
      fail-fast: false # So that one fail doesn't stop remaining tests
      matrix:
        python-version: ["3.13"]
        cpuif: ["passthrough", "apb4-flat", "apb3-flat", "ahb-flat", "axi4-lite-flat", "avalon-mm-flat", "obi-flat", "wishbone-flat"]
        target: [verilator]
    # Pinned explicitly: ubuntu-latest can resolve to 26.04, whose asset now exists.
    # See https://github.com/veryl-lang/setup-verilator/issues/2
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
      - name: Setup Verilator
        uses: veryl-lang/setup-verilator@v1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install system tools
        run: |
          # mold: the prebuilt verilator archives bake -fuse-ld=mold into verilated.mk
          sudo apt install ccache mold
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -m pip install .
      - name: Run Tests
        run: |
          unset PYTHONHOME
          cd tests
          ./test_all.sh SIM=verilator GIT_CHECK=0 CPUIF=${{ matrix.cpuif }}
