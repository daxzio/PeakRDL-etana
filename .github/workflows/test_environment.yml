name: Check cached Setup

# Manual check that the setup actions used by the test workflows install
# and are on PATH. The test jobs call these same actions; this workflow
# does not compile Icarus or Verilator from source.

on:
  workflow_dispatch:

jobs:
  check_verilator:
    # Same runner as the Verilator test workflows.
    runs-on: ubuntu-26.04
    steps:
      - name: Setup Verilator
        uses: veryl-lang/setup-verilator@v2
      - name: Report verilator
        run: |
          which verilator
          verilator --version

  check_icarus:
    # Same runner as the Icarus test workflow.
    runs-on: ubuntu-26.04
    steps:
      - name: Setup Icarus
        uses: daxzio/setup-icarus@v1
      - name: Report Icarus
        run: |
          which iverilog
          iverilog -V
