name: Test PeakRDL Regblock verilator
on:
  push:
    # tags-ignore:
    #   - '**'  # Don't run on any tags
  pull_request:
  schedule:
    - cron: '0 1 * * 0'
jobs:
  build_code_linux:
    strategy:
      fail-fast: false # So that one fail doesn't stop remaining tests
      matrix:
        python-version: ["3.13"]
        cpuif: ["passthrough", "apb4-flat", "apb3-flat", "axi4-lite-flat", "avalon-mm-flat", "obi-flat", "wishbone-flat", "apb4", "apb3", "axi4-lite", "avalon-mm", "obi", "wishbone"]
        target: [verilator]
    # Pinned explicitly: ubuntu-latest can resolve to 26.04, whose asset now exists.
    # See https://github.com/veryl-lang/setup-verilator/issues/2
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
      - name: Setup Verilator
        uses: veryl-lang/setup-verilator@v1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install system tools
        run: |
          # mold: the prebuilt verilator archives bake -fuse-ld=mold into verilated.mk
          sudo apt install ccache mold
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -m pip install .
          python -m pip uninstall -y peakrdl-regblock
          python -m pip install --upgrade git+https://github.com/SystemRDL/PeakRDL-regblock.git@main
          # The wheel carries no hdl-src/*_intf.sv, so generate_wrapper.py cannot
          # find the non-flat interface sources. Place them next to the package.
          sitepkg="$(python -c 'import os, peakrdl_regblock; print(os.path.dirname(os.path.dirname(peakrdl_regblock.__file__)))')"
          git clone -q --depth 1 -b main https://github.com/SystemRDL/PeakRDL-regblock.git /tmp/peakrdl-regblock-src
          cp -r /tmp/peakrdl-regblock-src/hdl-src "${sitepkg}/"
          ls "${sitepkg}/hdl-src"
      - name: Run Tests
        run: |
          unset PYTHONHOME
          cd tests
          ./test_all.sh REGBLOCK=1 SIM=verilator GIT_CHECK=0 CPUIF=${{ matrix.cpuif }}
