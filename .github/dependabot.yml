# Dependabot configuration for automatic dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot-version-updates-file
#
# Dependabot only reads this file from the default branch (main). The active
# development branch is develop, which is ahead of main, so updates target it.
#
# Dependabot covers two things here: the action refs in .github/workflows and
# the PyPI packages in requirements.txt. It cannot see the tool versions passed
# to actions as inputs (setup-icarus "2026.11.04", setup-nvc "latest", ...), nor
# the git dependencies in requirements.txt. Those are checked weekly by
# .github/workflows/tool-versions.yml.

version: 2
updates:
  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    # Group all GitHub Actions updates into a single PR
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"

  # Python packages: requirements.txt, pyproject.toml and the test extras in
  # one entry. A second entry for this directory is rejected by Dependabot.
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    # Group Python dependency updates
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"

  # Documentation build dependencies.
  - package-ecosystem: "pip"
    directory: "/docs"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
      - "documentation"
    groups:
      docs-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
